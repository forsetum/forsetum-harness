name: Validate template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu Bash
            os: ubuntu-24.04
            shell: bash
            kind: bash
          - label: macOS Bash 4+
            os: macos-14
            shell: bash
            kind: bash
          - label: Windows Git Bash
            os: windows-2022
            shell: bash
            kind: bash
            msys: winsymlinks:nativestrict
          - label: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            kind: powershell
          - label: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            kind: powershell
    env:
      MSYS: ${{ matrix.msys }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Bash 4+ on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          {
            uname -a
            brew list bash >/dev/null 2>&1 || brew install bash
            echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee evidence/bash-setup.log

      - name: Verify native Windows symlink fixtures
        if: runner.os == 'Windows' && matrix.kind == 'bash'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          preflight="$(mktemp -d "${TMPDIR:-/tmp}/forsetum-symlinks.XXXXXX")"
          trap 'rm -rf -- "$preflight"' EXIT
          {
            printf 'MSYS=%s\n' "$MSYS"
            printf 'fixture target\n' >"$preflight/real"
            ln -s "$preflight/real" "$preflight/link"
            [[ -L "$preflight/link" && -f "$preflight/link" ]] || { printf 'FAIL: real native symlink required\n' >&2; exit 1; }
            ln -s "$preflight/missing" "$preflight/dangling"
            [[ -L "$preflight/dangling" && ! -e "$preflight/dangling" ]] || { printf 'FAIL: dangling native symlink required\n' >&2; exit 1; }
            printf 'PASS: real and dangling native symlink fixtures\n'
          } 2>&1 | tee evidence/symlink-preflight.log

      - name: Bash compatibility and source gates
        if: matrix.kind == 'bash'
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          # macOS default bash is 3.2; invoke the selected executable explicitly.
          {
            uname -a
            gate_bash="$(command -v bash)"
            "$gate_bash" -c '(( BASH_VERSINFO[0] >= 4 ))'
            "$gate_bash" --version
            git --version
            git rev-parse HEAD
            find scripts skills/forsetum-harness -type f -name '*.sh' -exec "$gate_bash" -n {} +
            "$gate_bash" scripts/test-product.sh
            git diff --check
          } 2>&1 | tee evidence/compatibility.log

      - name: Native PowerShell compatibility gate
        if: matrix.kind == 'powershell'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          Start-Transcript -Path evidence/compatibility.log
          try {
            $PSVersionTable | Format-List
            [Environment]::OSVersion.VersionString
            git --version
            git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Git version evidence failed' }
            & ./scripts/test-product.ps1
            if (-not $?) { throw 'Product gate failed' }
          } finally {
            Stop-Transcript
          }

      - name: Upload environment and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.shell }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  # Preserve existing required-check names while gating on all five environments.
  linux-validation:
    name: Linux Validation
    runs-on: ubuntu-24.04
    needs: compatibility
    if: always()
    steps:
      - name: Require complete compatibility success
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$RESULT" = success
          echo 'All five compatibility jobs passed.'

  windows-powershell-validation:
    name: Windows PowerShell Validation
    runs-on: ubuntu-24.04
    needs: compatibility
    if: always()
    steps:
      - name: Require complete compatibility success
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$RESULT" = success
          echo 'All five compatibility jobs passed.'
